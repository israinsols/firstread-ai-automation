{% extends "base.html" %}
{% block content %}
<header class="section">
  <p class="eyebrow">{{ taxonomy }}</p>
  <h1>{{ heading }}</h1>
  <p>Published articles about {{ heading }}.</p>
</header>
<div class="post-grid">
  {% for post in posts %}
  <article class="card">
    <a class="card-image" href="/{{ post.slug }}/"><img src="{{ post.thumbnail }}" alt="" width="400" height="210" loading="lazy"></a>
    <div class="card-body"><h2><a href="/{{ post.slug }}/">{{ post.title }}</a></h2><p>{{ post.meta_description }}</p><p class="muted">{{ post.date }} · {{ post.reading_time }} min read</p></div>
  </article>
  {% endfor %}
</div>
{% endblock %}
