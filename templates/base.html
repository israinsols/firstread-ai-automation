<!doctype html>
<html lang="{{ language }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f5f2eb">
  <title>{{ page_title }}</title>
  <meta name="description" content="{{ description }}">
  <link rel="canonical" href="{{ canonical }}">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="alternate" type="application/rss+xml" title="{{ site_name }} RSS" href="/rss.xml">
  <meta property="og:type" content="{{ og_type }}">
  <meta property="og:site_name" content="{{ site_name }}">
  <meta property="og:title" content="{{ page_title }}">
  <meta property="og:description" content="{{ description }}">
  <meta property="og:url" content="{{ canonical }}">
  <meta property="og:image" content="{{ social_image }}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ page_title }}">
  <meta name="twitter:description" content="{{ description }}">
  <meta name="twitter:image" content="{{ social_image }}">
  <link rel="stylesheet" href="/static/site.css">
  <script type="application/ld+json">{{ json_ld | tojson }}</script>
</head>
<body>
  <a class="skip" href="/#main">Skip to content</a>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="{{ brand_url }}" aria-label="Visit Firstread.co.uk" target="_blank" rel="noopener noreferrer">
        <img src="/static/logo.svg" alt="" width="42" height="42">
        <span>firstread<span class="brand-period">.co.uk</span></span>
      </a>
      <span class="edition-note">A magazine for curious minds</span>
    </div>
  </header>
  <main id="main" class="wrap">
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    <div class="wrap footer-inner">
      <a class="footer-brand" href="{{ brand_url }}" aria-label="Visit Firstread.co.uk" target="_blank" rel="noopener noreferrer">
        <img src="/static/logo.svg" alt="" width="30" height="30">
        <span>&copy; {{ current_year }} <strong>firstread.co.uk</strong></span>
      </a>
      <a class="footer-domain-link" href="{{ brand_url }}" target="_blank" rel="noopener noreferrer">Visit firstread.co.uk ↗</a>
    </div>
  </footer>
</body>
</html>
