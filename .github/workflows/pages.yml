name: Deploy Firstread to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/pages.yml"
      - "builder.py"
      - "config.py"
      - "content/pages/**"
      - "content/posts/**"
      - "images.py"
      - "main.py"
      - "requirements.txt"
      - "seo.py"
      - "static/**"
      - "templates/**"
  workflow_run:
    workflows:
      - Daily Firstread article
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      SITE_DOMAIN: israinsols.github.io
      SITE_BASE_PATH: /firstread-ai-automation

    steps:
      - name: Check out site source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Build static site for GitHub Pages
        run: python main.py --build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
