name: Daily Firstread article

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-firstread-article
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AUTO_PUBLISH: "true"
      POSTS_PER_DAY: "1"
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore keyword research database
        uses: actions/cache@v4
        with:
          path: data/firstread.sqlite3
          key: ${{ runner.os }}-firstread-keywords-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-firstread-keywords-${{ github.ref_name }}-

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Generate and build one published article
        run: python main.py --all

      - name: Commit generated article
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/posts/*.md
          if git diff --cached --quiet; then
            echo "No generated article changes to commit."
            exit 0
          fi
          git commit -m "Publish daily Firstread article"
          git push
